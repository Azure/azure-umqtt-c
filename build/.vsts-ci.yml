        libssl-dev \
        uuid-dev
    displayName: 'Host setup'
  - script: |
      sudo chmod 755 jenkins/debian_c.sh
      sudo -E ./jenkins/debian_c.sh
    displayName: 'Build'

- job: linux_install_deps
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Debian (Buster) with Installed Deps'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        libssl-dev \
        uuid-dev
    displayName: 'Host setup'
  - script: |
      if [ -f "jenkins/linux_install_deps.sh" ]
      then
        sudo chmod 755 jenkins/linux_install_deps.sh
        sudo -E ./jenkins/linux_install_deps.sh
      fi
    displayName: 'Build'

- job: OSX
  timeoutInMinutes: 60
  variables:
    CodeQL.Enabled: false
  pool:
    vmImage: 'macOS-14'
  displayName: 'OSX'
  # Disabled: macOS builds with clang, which this branch's dependency set does
  # not compile under. See the clang job above.
  condition: false
  steps:
  - checkout: self
    submodules: recursive
  - script: |
      sudo chmod -R 755 .
      ./jenkins/osx_gcc_openssl.sh
    displayName: 'Build'

- job: xcodenative
  timeoutInMinutes: 60
  variables:
    CodeQL.Enabled: false
  pool:
    vmImage: 'macOS-14'
  displayName: 'XCode Native'
  # Disabled: same clang incompatibility as the OSX job.
  condition: false
  steps:
  - checkout: self
    submodules: recursive
  - script: |
      sudo chmod -R 755 .
      ./jenkins/osx_xcode_native.sh
    displayName: 'Build'

- job: raspberrypi
  # ARM cross-compile replacement for the retired raspberrypi-c-buster
  # container. Cross-compiled with the arm-linux-gnueabihf toolchain on an
  # x64 Microsoft-hosted agent; tests are not executed.
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Raspberry Pi (Cross-compile only)'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        crossbuild-essential-armhf
    displayName: 'Install armhf cross toolchain'
  - script: |
      set -e
      mkdir -p cmake-armhf
      cd cmake-armhf
      cmake \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_SYSTEM_PROCESSOR=arm \
        -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
        -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
        -DCMAKE_BUILD_TYPE=Debug \
        -Drun_unittests:BOOL=OFF \
        -Dskip_samples:BOOL=ON \
        -Duse_installed_dependencies:BOOL=OFF \
        -Duse_default_uuid:BOOL=ON \
        -Duse_http:BOOL=OFF \
        -Duse_openssl:BOOL=OFF \
        ..
      make -j$(nproc)
    displayName: 'Cross-compile umqtt for armhf'
