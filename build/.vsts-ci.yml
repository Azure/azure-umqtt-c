name: $(BuildID)_$(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

# This pipeline was migrated off the csdkcontainerregistry container images and
# the self-hosted 'sdk-c--*' agent pools onto Microsoft-hosted vmImage agents.
# Both are gone, so every job on this branch failed before running a build:
#   "Could not fetch access token for ACR"
#   "No image label found to route agent pool Azure Pipelines"
#   "Value cannot be null. (Parameter 'ContainerId')"
# This mirrors the migration already done on master.
#
# umqtt has no E2E tests, so the IoT Hub / DPS secret env blocks that used to be
# plumbed into every job are removed; unit tests never read them.
#
# The clang, OSX and XCode Native jobs are disabled rather than migrated. The
# dependency set pinned on this branch does not compile under a current clang:
# deps/ctest ships an aux stdbool.h that collides with the toolchain header, and
# the old umock-c/macro-utils headers trigger typedef-redefinition errors.
# The retired containers pinned older toolchains, which is what hid this.
# Re-enabling them needs a dependency update, which is out of scope here.

resources:
  - repo: self
    clean: true

jobs:
- job: checksubmodule
  variables:
    CodeQL.Enabled: false
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Check Submodules'
  steps:
  - checkout: self
    submodules: recursive
  # The previous 'check_submodules . master' compared this branch's submodule
  # pointers against master, which is wrong for a maintenance branch and cannot
  # pass here. This check instead verifies the recursive submodule graph agrees
  # with itself: wherever the same repository appears more than once, every
  # reference must pin the same commit. It is branch-agnostic and uses only
  # local git, so no code is downloaded or executed from a moving ref.
  - script: |
      set -e
      tmp=$(mktemp); norm=$(mktemp)
      git submodule foreach --recursive --quiet \
        'echo "$(git config --get remote.origin.url) $(git rev-parse HEAD) $displaypath"' > "$tmp"
      awk '{ u=$1; sub(/^https:\/\/github\.com\//,"",u); sub(/^git@github\.com:/,"",u);
             sub(/\.git$/,"",u); print tolower(u), $2, $3 }' "$tmp" | sort -u > "$norm"
      conflicts=$(awk '{print $1, $2}' "$norm" | sort -u | awk '{c[$1]++} END{for(r in c) if(c[r]>1) print r}')
      if [ -n "$conflicts" ]; then
        echo "Submodule consistency check FAILED; conflicting commits:"
        for r in $conflicts; do
          echo "  $r"
          awk -v r="$r" '$1==r{print "    "$2"  "$3}' "$norm"
        done
        exit 1
      fi
      echo "Submodule consistency check passed ($(wc -l < "$norm") references)."
    displayName: 'Check Submodule Consistency'

- job: windowsx86
  timeoutInMinutes: 90
  pool:
    vmImage: 'windows-2022'
  displayName: 'Windows x86'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      call jenkins\windows_c_VsDevCmd.cmd && call jenkins\windows_c.cmd
    displayName: 'Build'
  - task: ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'

- job: windowsx64
  timeoutInMinutes: 90
  variables:
    CodeQL.Enabled: false
  pool:
    vmImage: 'windows-2022'
  displayName: 'Windows x64'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      call jenkins\windows_c_VsDevCmd.cmd x64 && call jenkins\windows_c.cmd --platform x64
    displayName: 'Build'
  - task: ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'

- job: windowsdynamic
  timeoutInMinutes: 90
  pool:
    vmImage: 'windows-2022'
  displayName: 'Windows Dynamic'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      call jenkins\windows_c_VsDevCmd.cmd && call jenkins\windows_c_build_as_dynamic.cmd
    displayName: 'Build'
  - task: ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'

- job: clang
  timeoutInMinutes: 90
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Ubuntu Clang'
  # Disabled: this branch's deps/ctest and umock-c do not compile under a
  # current clang (aux stdbool.h collision, typedef redefinition, SIZE_MAX).
  # Needs a dependency update to re-enable.
  condition: false
  steps:
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        clang \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        libssl-dev \
        uuid-dev
    displayName: 'Host setup'
  - script: |
      export OPENSSL_ia32cap=0x00000000
      sudo chmod -R 755 .
      sudo -E ./jenkins/ubuntu_clang.sh
    displayName: 'Build'

- job: ubuntu
  timeoutInMinutes: 90
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Ubuntu'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        libssl-dev \
        uuid-dev \
        valgrind
    displayName: 'Host setup'
  - script: |
      export OPENSSL_ia32cap=0x00000000
      sudo chmod -R 755 .
      sudo -E ./jenkins/ubuntu_c.sh
    displayName: 'Build'

- job: linuxoptions
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Ubuntu with Options'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        libssl-dev \
        uuid-dev
    displayName: 'Host setup'
  - script: 'sudo ./jenkins/linux_c_option_test.sh'
    displayName: 'Build'

- job: wolfssl
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Ubuntu with WolfSSL'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        uuid-dev \
        libwolfssl-dev
    displayName: 'Host setup'
  - script: |
      LD_LIBRARY_PATH=/usr/local/lib
      LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/my_library/
      sudo jenkins/linux_wolfssl.sh
    displayName: 'Build'

- job: debian
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Debian (Buster)'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
