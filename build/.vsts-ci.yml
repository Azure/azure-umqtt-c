- job: clang
  timeoutInMinutes: 90
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Ubuntu Clang'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        clang \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        libssl-dev \
        uuid-dev
    displayName: 'Host setup'
  - script: |
      export OPENSSL_ia32cap=0x00000000
      # The retired linux-c-ubuntu-clang container selected clang via its image
      # environment. On a hosted agent nothing sets it, so the job would build
      # with gcc and silently stop being clang coverage.
      export CC=clang
      export CXX=clang++
      sudo chmod -R 755 .
      sudo -E ./jenkins/ubuntu_clang.sh
    displayName: 'Build'

